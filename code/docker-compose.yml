x-device: &device-template
  build: .
  volumes:
    - ./shared_data:/shared_data
  command: python3 iot_app.py

services:
  # --- Φυσιολογικές Συσκευές (Noise / Benign Data) ---
  node1: { <<: *device-template, environment: [ "DEVICE_ID=node-1-clean", "PROFILE=normal" ] }
  node2: { <<: *device-template, environment: [ "DEVICE_ID=node-2-clean", "PROFILE=normal" ] }
  node3: { <<: *device-template, environment: [ "DEVICE_ID=node-3-clean", "PROFILE=normal" ] }
  node4: { <<: *device-template, environment: [ "DEVICE_ID=node-4-clean", "PROFILE=normal" ] }
  node5: { <<: *device-template, environment: [ "DEVICE_ID=node-5-clean", "PROFILE=normal" ] }

  # --- Κλασικές Επιθέσεις ---
  node6: { <<: *device-template, environment: [ "DEVICE_ID=node-6-overflow", "PROFILE=overflow" ] }
  node7: { <<: *device-template, environment: [ "DEVICE_ID=node-7-timespoof", "PROFILE=timespoof" ] }
  node8: { <<: *device-template, environment: [ "DEVICE_ID=node-8-spammer", "PROFILE=spam" ] }
  
  # --- Προηγμένες / Edge Case Επιθέσεις ---
  node9: { <<: *device-template, environment: [ "DEVICE_ID=node-9-stealth", "PROFILE=stealth" ] }
  node10: { <<: *device-template, environment: [ "DEVICE_ID=node-10-fuzzer", "PROFILE=fuzzer" ] }
  node11: { <<: *device-template, environment: [ "DEVICE_ID=node-11-pulsing", "PROFILE=pulsing" ] }

  # --- Απρόβλεπτες Συσκευές (Mixed / APT Simulation) ---
  node12: { <<: *device-template, environment: [ "DEVICE_ID=node-12-mixed", "PROFILE=mixed" ] }
  node13: { <<: *device-template, environment: [ "DEVICE_ID=node-13-mixed", "PROFILE=mixed" ] }
  node14: { <<: *device-template, environment: [ "DEVICE_ID=node-14-mixed", "PROFILE=mixed" ] }
  node15: { <<: *device-template, environment: [ "DEVICE_ID=node-15-mixed", "PROFILE=mixed" ] }

  # --- Ο Κεντρικός Μηχανισμός Παρακολούθησης ---
  monitor:
    build: .
    volumes:
      - ./shared_data:/shared_data
    command: sh -c "> /shared_data/events.log && > /shared_data/alerts.log && tail -F /shared_data/events.log | python3 canonicaliser.py | python3 cloud_monitor.py"

  # --- Layer 3: Formal Runtime Verification Monitor ---
  correlator:
    build: .
    volumes:
      - ./shared_data:/shared_data
      - ./monpoly_specs:/app/monpoly_specs
      - ./tessla_specs:/app/tessla_specs
      - ./rtlola_specs:/app/rtlola_specs
    command: sh -c "sleep 5 && > /shared_data/incidents.log && tail -F /shared_data/alerts.log | python3 correlator_monitor.py"
    depends_on:
      - monitor

volumes:
  shared_logs: